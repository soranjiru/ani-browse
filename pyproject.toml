[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ani-browse"
version = "0.1.3"
description = "A fast keyboard-driven anime browsing TUI powered by MyAnimeList and ani-cli"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual",
    "httpx",
    "python-dotenv",
    "msgspec",
]

[project.scripts]
ani-browse = "ani_browse.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]